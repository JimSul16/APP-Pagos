<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-title>Bienvenido</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar color="primary">
      <ion-title size="large">Bienvenido</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-img
    class="welcome-image"
    src="assets/img/welcome-banner.svg"
    alt="Banner de bienvenida">
  </ion-img>

  <ion-card>
    <ion-card-header>
      <ion-card-title>Sistema de Compra y Pago</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      Esta aplicación te permite registrar tus compras de manera rápida y sencilla,
      calcular el total de tus productos y gestionar los pagos correspondientes.
      ¡Comienza agregando productos a tu carrito!
    </ion-card-content>
  </ion-card>

  <ion-button expand="block" color="primary" routerLink="/tabs/tab2">
    <ion-icon name="cart-outline" slot="start"></ion-icon>
    Iniciar Compra
  </ion-button>
</ion-content>
