<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3880ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5260ff;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" fill="url(#bgGrad)" rx="0" ry="0"/>

  <!-- Decorative circles -->
  <circle cx="120" cy="80" r="50" fill="rgba(255,255,255,0.08)"/>
  <circle cx="700" cy="320" r="70" fill="rgba(255,255,255,0.08)"/>
  <circle cx="650" cy="80" r="30" fill="rgba(255,255,255,0.1)"/>
  <circle cx="180" cy="340" r="40" fill="rgba(255,255,255,0.06)"/>
  <circle cx="400" cy="50" r="20" fill="rgba(255,255,255,0.12)"/>
  <circle cx="50" cy="200" r="25" fill="rgba(255,255,255,0.07)"/>
  <circle cx="750" cy="180" r="35" fill="rgba(255,255,255,0.05)"/>

  <!-- Decorative lines -->
  <line x1="0" y1="350" x2="250" y2="300" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>
  <line x1="550" y1="50" x2="800" y2="100" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>
  <line x1="300" y1="380" x2="500" y2="370" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

  <!-- Shopping Cart Icon (centered) -->
  <g transform="translate(400, 170)" fill="none" stroke="white" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Cart body -->
    <path d="M-60,0 L-45,-40 L55,-40 L45,0 Z" fill="rgba(255,255,255,0.15)" stroke="white"/>
    <!-- Cart handle -->
    <line x1="-45" y1="-40" x2="-70" y2="-60"/>
    <line x1="-70" y1="-60" x2="-80" y2="-60"/>
    <!-- Cart wheels -->
    <circle cx="-35" cy="15" r="8" fill="white"/>
    <circle cx="30" cy="15" r="8" fill="white"/>
    <!-- Items in cart -->
    <rect x="-25" y="-35" width="15" height="20" rx="2" fill="rgba(255,255,255,0.3)" stroke="none"/>
    <rect x="0" y="-35" width="15" height="25" rx="2" fill="rgba(255,255,255,0.25)" stroke="none"/>
    <rect x="25" y="-35" width="12" height="18" rx="2" fill="rgba(255,255,255,0.2)" stroke="none"/>
  </g>

  <!-- Store roof shape -->
  <g transform="translate(400, 100)" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2">
    <path d="M-100,-20 L0,-50 L100,-20" stroke-width="3"/>
    <line x1="-100" y1="-20" x2="-100" y2="-10"/>
    <line x1="100" y1="-20" x2="100" y2="-10"/>
  </g>

  <!-- Title Text -->
  <text x="400" y="280" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="36" font-weight="bold" fill="white" letter-spacing="2">
    Compra &amp; Pago
  </text>

  <!-- Subtitle -->
  <text x="400" y="320" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="rgba(255,255,255,0.7)" letter-spacing="1">
    Tu sistema de compras inteligente
  </text>
</svg>
